<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MSP · Planning avec marge</title>
<style>
:root{--ti:#2b7a3d;--rb:#f3f4f2;--cr:#d33a2c;--pa:#8a4bd8;--bg:#f6f7f4;--pn:#fff;--tx:#1d2b2a;--mu:#6b7a78;--ln:#dfe4e0;--or:#aab4b2;--nw:#2f6fba;--su:#1b2a3a;--ms:#d9791c;--ac:#2b7a3d;--hd:#eef1ee}
@media (prefers-color-scheme:dark){:root{--ti:#1e5a2e;--rb:#1f2926;--cr:#ff6b5c;--pa:#b48cf5;--bg:#121816;--pn:#1a2220;--tx:#e6ecea;--mu:#8b9a97;--ln:#2b3633;--or:#5d6b68;--nw:#6aa8ee;--su:#9bb7d8;--ms:#f09a45;--ac:#5bbd72;--hd:#212b28}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:13px/1.4 "Segoe UI",system-ui,sans-serif;display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:8px 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
h1{font-size:16px;margin:0 6px 0 0;font-weight:600}
label{display:flex;gap:5px;align-items:center;color:var(--mu)}
input,select,button,summary{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:5px;padding:4px 8px}
input[type=number]{width:64px}input[type=checkbox],input[type=range]{padding:0}
button,summary{cursor:pointer}button.p{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:600}
button:disabled{opacity:.4;cursor:default}
details{position:relative}summary{list-style:none}
.pan{position:absolute;top:110%;left:0;z-index:20;background:var(--pn);border:1px solid var(--ln);border-radius:6px;padding:8px;max-height:60vh;overflow:auto;width:290px;box-shadow:0 6px 20px #0003}
.pan label{color:var(--tx);padding:1px 0}.pan div.b{display:flex;gap:6px;margin-bottom:6px}
#lv button{padding:3px 9px;margin-left:3px}
#stats{display:flex;flex-wrap:wrap;gap:4px 22px;padding:6px 12px;background:var(--pn);border-bottom:1px solid var(--ln);color:var(--mu)}
#stats b{color:var(--tx)}
#msg{padding:6px 12px;color:#b3261e;display:none}
#main{flex:1;display:flex;min-height:0}
#L{overflow:auto;width:60%;min-width:220px;max-width:92%}
#sp{width:7px;flex:none;cursor:col-resize;background:var(--ln)}#sp:hover,#sp.on{background:var(--ac)}
#R{flex:1;overflow:auto;min-width:120px}
#empty{margin:10% auto;max-width:460px;text-align:center;color:var(--mu);border:2px dashed var(--ln);border-radius:12px;padding:36px}
table{border-collapse:separate;border-spacing:0;table-layout:fixed}
th{position:sticky;top:0;z-index:2;background:var(--hd);height:52px;padding:0 4px 0 6px;text-align:left;font-weight:600;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);white-space:nowrap;overflow:hidden}
th .fb{float:right;margin-top:14px;padding:0 4px;font-size:11px;line-height:18px;border-radius:3px;background:var(--pn)}
th .fb.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
th em{font-style:normal;color:var(--ac);margin-left:4px}
td{height:26px;padding:0 6px;border-right:1px solid var(--ln);border-bottom:1px solid var(--ln);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
td.kind{padding:2px 4px;overflow:visible}
td.kind .task-kind{display:inline-flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--ln);border-radius:7px;background:var(--hd)}
.task-kind button{display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:3px 6px;border:1px solid transparent;border-radius:5px;background:transparent;color:var(--mu);font-size:11px;line-height:1.2;white-space:nowrap}
.task-kind button svg{width:13px;height:13px;flex:none}
.task-kind button.active{background:var(--pn);border-color:var(--ln);color:var(--ac);box-shadow:0 1px 2px #0001}
.task-kind button[data-task-value="1"].active{color:var(--ms)}
.task-kind button:hover:not(:disabled){background:color-mix(in srgb,var(--ac) 10%,var(--pn));color:var(--tx)}
.task-kind button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.task-kind button:disabled{opacity:.55;cursor:not-allowed}
.task-kind[aria-disabled=true]{opacity:.72}
tr:hover>td,.gr:hover{background-color:color-mix(in srgb,var(--ac) 9%,var(--pn))}
tr.sm td{font-weight:600;background-color:color-mix(in srgb,var(--ac) 5%,var(--pn))}
td.nu{text-align:right}td.mg{color:var(--nw)}
td[data-e]{cursor:text;box-shadow:inset 0 -1px 0 var(--ln)}td[data-e]:hover{box-shadow:inset 0 0 0 1px var(--mu)}
.tg{display:inline-block;width:16px;cursor:pointer;font-size:10px;color:var(--ac);user-select:none}
.menu{position:fixed;z-index:50;width:250px;background:var(--pn);border:1px solid var(--ln);border-radius:6px;box-shadow:0 8px 28px #0004;padding:6px;font-size:13px}
.menu a{display:block;padding:4px 8px;cursor:pointer;border-radius:4px}.menu a:hover{background:var(--hd)}.menu a.off{opacity:.4;pointer-events:none}
.menu hr{border:0;border-top:1px solid var(--ln);margin:5px 0}
.menu .cd{display:flex;gap:4px;margin-bottom:6px}.menu .cd select{flex:1;min-width:0}.menu .cd input{width:80px}
.menu .q{width:100%;margin-bottom:4px}
.menu .ls{max-height:200px;overflow:auto;border:1px solid var(--ln);border-radius:4px;padding:3px 6px;background:var(--bg)}
.menu .ls label{color:var(--tx);padding:1px 0;white-space:nowrap}
.menu .bt{display:flex;justify-content:flex-end;gap:6px;margin-top:6px}
.gh{position:sticky;top:0;z-index:3;height:52px;background:var(--hd);border-bottom:1px solid var(--ln)}
.mo{position:absolute;border-left:1px solid var(--ln);padding:3px 5px;color:var(--mu);font-size:12px;white-space:nowrap;height:100%}
.mo b{position:absolute;top:0;left:5px;color:var(--tx)}.mo span{position:absolute;top:20px}.dy{position:absolute;top:37px;font-size:10px;color:var(--mu);text-align:center}.dy.we{opacity:.5}
.gr{position:relative;height:26px;border-bottom:1px solid var(--ln)}
.o,.n,.m{position:absolute;display:block}
.o{background:var(--or);height:6px;top:3px;opacity:.8;border-radius:3px}
.n{background:var(--nw);height:11px;top:11px;border-radius:3px}
.sm.gr .n{background:var(--su);height:8px;top:12px;border-radius:0}
.m{transform:rotate(45deg)}.m.o{background:var(--or);top:2px;width:8px;height:8px;border-radius:0}.m.n{background:var(--ms);top:12px;width:11px;height:11px;border-radius:0}
.bl{position:absolute;height:4px;top:0;background:repeating-linear-gradient(90deg,var(--ms) 0 4px,transparent 4px 7px)}
.m.bl{top:1px;width:7px;height:7px;background:var(--ms)}
.a{position:absolute;display:block;height:3px;top:7px;background:var(--ac);border-radius:2px}
.am{position:absolute;top:3px;height:12px;border-left:2px solid var(--ac);pointer-events:none}
.m.a{top:5px;width:7px;height:7px;background:var(--ac)}
.n.cr,.sm.gr .n.cr{background:var(--cr)}.n.pa,.sm.gr .n.pa{background:var(--pa)}.m.n.cr{background:var(--cr)}.m.n.pa{background:var(--pa)}
.pg{background:var(--tx);opacity:.45;height:11px;top:11px;border-radius:3px}.sm.gr .pg{height:8px;top:12px;border-radius:0}
.pgo{background:var(--tx);opacity:.3;height:6px;top:3px;border-radius:3px}
tr.late>td:first-child{box-shadow:inset 3px 0 0 var(--cr)}.gr.late{box-shadow:inset 3px 0 0 var(--cr)}
tr.warn>td:first-child{box-shadow:inset 3px 0 0 var(--ms)}.gr.warn{box-shadow:inset 3px 0 0 var(--ms)}
tr.grph td{background:var(--hd);font-weight:700}tr.grph em{color:var(--mu);font-weight:400}
.grh{height:26px;border-bottom:1px solid var(--ln);background:var(--hd);font-weight:700;padding:4px 8px;font-size:12px;white-space:nowrap;overflow:hidden}.grh em{color:var(--mu);font-weight:400}
.sel>td,.gr.sel{background-color:color-mix(in srgb,var(--pa) 16%,var(--pn))!important}
.lb{position:absolute;top:6px;font-size:11px;color:var(--mu);white-space:nowrap;pointer-events:none}
.pan h4{margin:8px 0 3px;font-size:12px;color:var(--mu)}.pan select{width:100%;margin-top:2px}
th,.gh{background:linear-gradient(var(--pn),var(--hd))}
#title{display:flex;align-items:center;gap:8px;min-height:32px;padding:4px 12px;background:var(--ti);color:#fff;font-weight:500;font-size:12px}
.logo{display:grid;place-items:center;width:22px;height:22px;border-radius:4px;background:#fff;color:var(--ti);font-size:13px}
#rib{display:block!important;padding:0!important;gap:0!important;background:var(--rb);border-bottom:1px solid var(--ln);position:relative;z-index:30}
#tabs{display:flex;gap:0;padding:0 12px;background:var(--pn);border-bottom:1px solid var(--ln)}
#tabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:var(--tx);padding:8px 14px 6px}
#tabs button[data-t=f]{color:var(--ti)}
#tabs button:hover{background:color-mix(in srgb,var(--ti) 8%,var(--pn))}
#tabs button.on{border-bottom-color:var(--ti);background:var(--pn);color:var(--ti);font-weight:600}
.bar{display:flex;align-items:stretch;min-height:96px;padding:5px 8px;background:var(--rb);overflow-x:auto}.bar[hidden]{display:none}
.g{display:flex;flex-direction:column;padding:0 8px;border-right:1px solid var(--ln);min-width:70px}
#tab-t .g{flex:none}#tab-t .row{flex-wrap:nowrap}#tab-t .big{min-width:56px;padding:4px 5px}
.g .row{flex:1;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.g .col{flex-direction:column;align-items:flex-start;justify-content:center}
.g h5{margin:3px 0 0;text-align:center;font-weight:400;font-size:11px;color:var(--mu)}
.g label{color:var(--tx)}.hint{max-width:220px;font-size:11px;color:var(--mu)}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-width:58px;min-height:62px;padding:5px 7px;border:1px solid transparent;background:transparent;border-radius:3px;font-size:11px}
.big i{font-style:normal;font-size:22px;line-height:1}
.big:hover{background:color-mix(in srgb,var(--ti) 10%,var(--rb));border-color:var(--ln)}
#q{max-width:120px}
@media(max-width:700px){#tabs{padding:0 4px}#tabs button{padding:8px 9px 6px}.g{flex:none}.g .row{flex-wrap:nowrap}}
#sb{display:flex;align-items:center;gap:16px;padding:3px 12px;background:var(--hd);border-top:1px solid var(--ln);font-size:12px}
#sb #stats{flex:1;background:none;border:0;padding:0}
#zm{display:flex;align-items:center;gap:6px}#zm button{padding:0 8px}#zm input{width:150px}
</style>
</head>
<body>
<div id="title"><b class="logo">M</b><span id="ttl">Planning sans titre — MSP</span></div>
<header id="rib">
<nav id="tabs"><button data-t="f">Fichier</button><button data-t="t" class="on">Tâche</button><button data-t="p">Projet</button><button data-t="v">Affichage</button><button data-t="m">Format</button></nav>
<input type="file" id="file" accept=".xml,.mspdi,.mpp,application/xml,text/xml" hidden>

<div class="bar" id="tab-f" hidden>
<section class="g"><div class="row"><button class="big" onclick="file.click()"><i>📂</i>Ouvrir</button></div><h5>Fichier</h5></section>
<section class="g"><div class="row"><button class="big" id="bx" disabled><i>🗂️</i>XML</button><button class="big" id="bc" disabled><i>📊</i>CSV</button><button class="big" id="bh" disabled><i>🌐</i>HTML</button><button class="big" id="bp" disabled><i>📄</i>PDF</button><button class="big" id="bpptx" disabled><i>PPT</i>PPTX</button><button class="big" id="br" disabled title="Rapport projet"><i>📈</i>Rapport</button></div><h5>Exporter</h5></section>
</div>

<div class="bar" id="tab-t">
<section class="g"><div class="row"><span id="lv"></span></div><h5>Hiérarchie</h5></section>
<section class="g"><div class="row"><button class="big" id="bAdd" disabled><i>➕</i>Ajouter</button><button class="big" id="bDel" disabled><i>🗑️</i>Suppr.</button><button class="big" id="bUp" disabled><i>⬆️</i>Monter</button><button class="big" id="bDn" disabled><i>⬇️</i>Descendre</button><button class="big" id="bInd" disabled><i>↪️</i>Indenter</button><button class="big" id="bOut" disabled><i>↩️</i>Désind.</button><button class="big" id="bUn" disabled><i>↶</i>Annuler</button><button class="big" id="bRe" disabled><i>↷</i>Rétablir</button></div><h5>Édition</h5></section>
<section class="g"><div class="row"><label>🔍 <input type="search" id="q" placeholder="Rechercher…" style="width:150px" title="Recherche rapide sur le nom / ID (Ctrl+F)"></label><label>Regrouper <select id="grp"></select></label><details class="dd"><summary class="big"><i>▦</i>Colonnes ▾</summary><div class="pan" id="pan"></div></details><button class="big" id="bf" title="Effacer les filtres et le tri"><i>🧹</i>Effacer</button></div><h5>Tableau</h5></section>
</div>

<div class="bar" id="tab-p" hidden>
<section class="g"><div class="row col"><label>Coefficient <input type="number" id="k" value="1.3" min="0.1" step="0.05"></label><label>Méthode <select id="mode"><option value="dep">Respecter les liens</option><option value="prop">Homothétie du calendrier</option></select></label></div><h5>Marge</h5></section>
<section class="g"><div class="row col"><label><input type="checkbox" id="calOn"> Jours ouvrés (calendrier du fichier)</label><label>Calendrier <select id="calSel"></select></label><small class="hint" id="calInfo"></small></div><h5>Calendrier</h5></section>
<section class="g"><div class="row col"><label>Emplacement <select id="baseSlot"><option value="0">Baseline 0 (principale)</option><option value="1">Baseline 1</option><option value="2">Baseline 2</option><option value="3">Baseline 3</option><option value="4">Baseline 4</option><option value="5">Baseline 5</option><option value="6">Baseline 6</option><option value="7">Baseline 7</option><option value="8">Baseline 8</option><option value="9">Baseline 9</option><option value="10">Baseline 10</option></select></label><div class="row"><button class="big" id="bBase" disabled><i>📌</i>Définir référence</button><button class="big" id="bBaseClear" disabled><i>✕</i>Effacer</button></div></div><h5>Baselines MS Project</h5></section>
<section class="g"><div class="row col"><label><input type="checkbox" id="useC" checked> Appliquer les contraintes</label></div><h5>Contraintes</h5></section>
</div>

<div class="bar" id="tab-v" hidden>
<section class="g"><div class="row"><button class="big" id="zfit"><i>⤢</i>Tout le projet</button><button class="big" id="zday"><i>🔍</i>1 jour</button></div><h5>Zoom</h5></section>
<section class="g"><div class="row col"><label><input type="checkbox" id="showO" checked> Planning initial</label><label><input type="checkbox" id="showB" checked> Référence (baseline)</label><label><input type="checkbox" id="showA" checked> Dates réelles</label><label><input type="checkbox" id="showL" checked> Liens entre tâches</label><label><input type="checkbox" id="showT" checked> Ligne « aujourd'hui »</label><label><input type="checkbox" id="showP" checked> Ligne de progression <input type="date" id="sd"></label></div><h5>Éléments</h5></section>
</div>

<div class="bar" id="tab-m" hidden>
<section class="g"><div class="row col"><label><input type="checkbox" id="showC"> Chemin critique du projet</label><small class="hint">Tâches critiques en rouge</small></div><h5>Styles de barres</h5></section>
<section class="g"><div class="row col"><label>Chemin de la tâche sélectionnée<select id="pm"><option value="none">Aucun</option><option value="predDrive">Prédécesseurs pilotants</option><option value="predAll">Tous les prédécesseurs</option><option value="succDrive">Successeurs pilotants</option><option value="succAll">Tous les successeurs</option><option value="bothDrive">Chemin pilotant complet</option></select></label></div><h5>Chemin</h5></section>
<section class="g"><div class="row"><details class="dd"><summary class="big"><i>🏷️</i>Détails ▾</summary><div class="pan" id="vpan" style="width:240px">
<label><input type="checkbox" data-d="nm"> Nom</label><label><input type="checkbox" data-d="id"> ID</label><label><input type="checkbox" data-d="du"> Durée (avec marge)</label><label><input type="checkbox" data-d="st"> Date de début</label><label><input type="checkbox" data-d="fi"> Date de fin</label><label><input type="checkbox" data-d="pc"> % achevé</label><label><input type="checkbox" data-d="rs"> Ressources</label><label><input type="checkbox" data-d="dl"> Décalage de fin</label></div></details></div><h5>Texte à droite des barres</h5></section>
</div>
</header>
<div id="msg"></div>
<div id="main"><div id="L"><div id="empty">Ouvrir un planning XML / MSPDI</div></div><div id="sp" title="Glisser pour redimensionner le tableau"></div><div id="R"></div></div>
<footer id="sb"><div id="stats"><span>Aucun fichier chargé</span></div><div id="zm"><button id="zo" title="Zoom arrière">−</button><input type="range" id="zoom" min="0" max="100" value="0"><button id="zi" title="Zoom avant">+</button><span id="zl"></span></div></footer>
<script>
const $=id=>document.getElementById(id),DAY=864e5,p2=n=>String(n).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const iso=d=>`${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}T${p2(d.getHours())}:${p2(d.getMinutes())}:${p2(d.getSeconds())}`;
const fd=d=>d.toLocaleDateString('fr-FR');
const kids=(e,t)=>[...e.children].filter(c=>c.localName===t);
const g=(e,t)=>{const n=kids(e,t)[0];return n?n.textContent:null};
const LAB={ID:'ID',UID:'UID',Name:'Nom',OutlineLevel:'Niveau',WBS:'WBS',OutlineNumber:'Numéro hiérarchique',Duration:'Durée',Start:'Début',Finish:'Fin',BaselineStart:'Début de référence',BaselineFinish:'Fin de référence',BaselineDuration:'Durée de référence',PercentComplete:'% achevé',PercentWorkComplete:'% travail achevé',Work:'Travail',Cost:'Coût (MSP)',FixedCost:'Coût fixe',ActualCost:'Coût réel (MSP)',RemainingCost:'Coût restant (MSP)',BaselineCost:'Coût de référence (MSP)',Priority:'Priorité',ConstraintType:'Type de contrainte',ConstraintDate:'Date de contrainte',Deadline:'Date limite',CalendarUID:'Calendrier',Notes:'Notes',Summary:'Récapitulative',Milestone:'Type de tâche',Critical:'Critique',TotalSlack:'Marge totale',FreeSlack:'Marge libre',ActualStart:'Début réel',ActualFinish:'Fin réelle',ActualDuration:'Durée réelle',RemainingDuration:'Durée restante',ActualWork:'Travail réel',RemainingWork:'Travail restant',Active:'Actif',Manual:'Manuel',Type:'Type',CreateDate:'Date de création',EarlyStart:'Début au plus tôt',EarlyFinish:'Fin au plus tôt',LateStart:'Début au plus tard',LateFinish:'Fin au plus tard',_pred:'Prédécesseurs',_res:'Noms des ressources',_ns:'Début (avec marge)',_nf:'Fin (avec marge)',_nd:'Durée (avec marge)',_dl:'Décalage fin (j)',_sv:'Écart début (j)',_fv:'Écart fin (j)',_al:'Alerte contrainte',_succ:'Successeurs',_budgetCost:'Budget / estimé',_actualCost:'Coût réel',_remainingCost:'Coût restant',_baselineCost:'Budget de référence',_costVariance:'Écart au budget'};
const CT=['Dès que possible','Le plus tard possible','Doit commencer le','Doit finir le','Début au plus tôt','Début au plus tard','Fin au plus tôt','Fin au plus tard'];
const BOOL=new Set(['Summary','Milestone','Critical','Active','Manual','Estimated','IsNull','Rollup','Recurring','External','Marked','HideBar']);
const COST_COLUMN_METRICS={_budgetCost:'budget',_actualCost:'actual',_remainingCost:'remaining',_baselineCost:'baseline',_costVariance:'variance'};
const COST_FIELD_NAMES=['Cost','FixedCost','ActualCost','RemainingCost','BaselineCost'];
const PRIO=['ID','Name','Milestone','Duration','Start','Finish','PercentComplete','_budgetCost','_actualCost','_pred','_res','_ns','_nf','_nd','_dl','_sv','_fv'];
let doc,tasks=[],roots=[],byUid={},cols=[],vis=new Set(),sort=null,filt={},collapsed=new Set(),fname='planning',cals={},projCalUid=null,defCalUid=null,dayH=8,hist=[],hidx=-1,grp=null,multi=new Set(),qsearch='',clip=null;
let resourceByUid=new Map(),assignmentsByTask=new Map(),defaultRate=null,minutesPerDay=480,minutesPerWeek=2400,daysPerMonth=20;
let currencyCode='EUR',currencySymbol='€',currencyKnown=false,currencyDigits=2,costCache=null;
const err=m=>{$('msg').textContent=m;$('msg').style.display=m?'block':'none'};

/* ---- Calendriers : calcul en temps ouvré ---- */
const msOfDay=d=>d.getHours()*36e5+d.getMinutes()*6e4+d.getSeconds()*1e3+d.getMilliseconds();
const tms=s=>{const m=/^(\d+):(\d+):(\d+)/.exec(s||'');return m?+m[1]*36e5+ +m[2]*6e4+ +m[3]*1e3:0};
const useCal=()=>{const c=$('calOn');return !!(c&&c.checked&&Object.keys(cals).length)};
function stdWeek(){const w=new Map();w.set(1,{working:false,times:[]});w.set(7,{working:false,times:[]});
  for(let i=2;i<=6;i++)w.set(i,{working:true,times:[[288e5,432e5],[468e5,612e5]]});return w}
function ymd(d){d=new Date(d);d.setHours(0,0,0,0);return d}
function dayDiff(a,b){a=ymd(a);b=ymd(b);const utc=dt=>Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate());return Math.round((utc(b)-utc(a))/DAY)}

$('bpptx').onclick=async()=>{if(!doc)return;
  const sel=[...multi];if(selUid&&!multi.has(selUid))sel.push(selUid);
  let list=sel.map(u=>byUid[u]).filter(Boolean);
  if(!list.length)list=rows().filter(o=>o.uid);

  try{const z=await buildPPTX(list);
    dl(fname+(sel.length?'-selection':'')+'.pptx',z,'application/vnd.openxmlformats-officedocument.presentationml.presentation')}

async function load(f){
  err('');fname=f.name.replace(/\.[^.]+$/,'');$('sd').value=iso(new Date()).slice(0,10);
  try{
    const buf=await f.arrayBuffer(),h=new Uint8Array(buf.slice(0,4));
    if(h[0]===0xD0&&h[1]===0xCF&&h[2]===0x11&&h[3]===0xE0)
      throw Error("Le format .mpp est binaire et propriétaire : cette page ne peut pas le lire. Dans MS Project : Fichier › Enregistrer sous › « Fichier XML », puis ouvrez ce fichier ici.");
    let txt;
    if(h[0]===0xFF&&h[1]===0xFE)txt=new TextDecoder('utf-16le').decode(buf);
    else if(h[0]===0xFE&&h[1]===0xFF)txt=new TextDecoder('utf-16be').decode(buf);
    else txt=new TextDecoder('utf-8').decode(buf);
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    if(ext==='mpp')throw Error("Le format .mpp est binaire et propriétaire : cette page ne peut pas le lire. Dans MS Project : Fichier › Enregistrer sous › « Fichier XML », puis ouvrez ce fichier ici.");
    parse(txt);buildHead();render();$('ttl').textContent=fname+' — MSP';showTab('t');
  }catch(e){err(e.message)}
}
